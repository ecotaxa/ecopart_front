name: CI/CD - Build and Publish Docker Image

# Trigger the workflow when a tag matching 'v*.*.*' is pushed
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # Job to run the test suite
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      # Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Install Node.js v20 and cache npm dependencies
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Install dependencies cleanly
      - name: Install dependencies
        run: npm ci

      # Run the tests with coverage
      - name: Run tests with coverage
        run: npm run test -- --coverage

      # Upload coverage reports to Codecov
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          slug: ${{ github.repository }}

  # Build one image per platform, each on a runner of that architecture.
  # arm64 used to be built under QEMU emulation on the amd64 runner, where
  # `npm ci` randomly hangs until the 6h job limit. Native runners avoid that.
  #   linux/amd64  the Linux servers
  #   linux/arm64  Apple Silicon dev machines
  # Each image is pushed by digest only (no tag); `publish` tags them together.
  # Requires 'test' job to pass.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # free GitHub-hosted arm64 runner for public repos

    steps:
      # linux/arm64 -> linux-arm64, usable in an artifact name
      - name: Prepare platform name
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      # Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the image for this platform and push it untagged, by digest.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          file: ./Dockerfile
          build-args: |
            VITE_BACKEND_URL=/api
          outputs: type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/ecopart_front,push-by-digest=true,name-canonical=true,push=true
        #   cache-from: type=gha
        #   cache-to: type=gha,mode=max

      # Hand the digest to the `publish` job through an artifact.
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-platform images into one multi-arch image and tag it:
  #   :<version>  immutable, the only thing preprod can be promoted to
  #   :latest     moving, followed by the test server
  # Nothing is rebuilt here, the tags are created registry-side.
  publish:
    name: Publish multi-arch image
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ecopart_front

    steps:
      # Extract the version from the tag, keeping the leading v (refs/tags/v1.0.0 -> v1.0.0).
      # This exact string is what preprod.yml expects as its `version` input.
      - name: Extract tag version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${{ steps.version.outputs.VERSION }}" \
            -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

      # Fails the job if the tag is missing, and logs both platforms.
      - name: Inspect the published image
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.VERSION }}"

  # Deploy the freshly built frontend image to the test server.
  # The test server is behind a firewall, so this runs on a self-hosted runner
  # registered at the GitHub org level with the label `ecopart-test`. That runner
  # is shared with the backend repo (ecopart_back) and is already installed — this
  # repo just reuses it, no new install needed. Requires 'publish' to pass.
  deploy-test:
    name: Deploy to test server
    needs: publish
    runs-on: [self-hosted, ecopart-test] # label set when the runner is installed on the test server

    steps:
      # No checkout: the server's docker-compose.yml is hand-maintained at
      # $DEPLOY_DIR and must never be copied or modified by CI.
      - name: Deploy latest frontend image
        env:
          # Directory on the server holding the front+back docker-compose.yml + .env.
          # This compose file is maintained by hand on the server and is NOT touched by CI.
          DEPLOY_DIR: /ecotaxadev2/ecopart/new_ecopart
          SERVICE: web # frontend service name in that compose (the backend service `api` is left alone)
        run: |
          cd "$DEPLOY_DIR"
          # Capture the running frontend image so we can remove only ours afterwards.
          OLD_IMAGE=$(docker compose images -q "$SERVICE")
          # Pull + recreate ONLY the frontend service; the backend (api) stays untouched.
          docker compose pull "$SERVICE" && docker compose up -d "$SERVICE"
          # Remove the previous frontend image only (if it changed and is now unused).
          NEW_IMAGE=$(docker compose images -q "$SERVICE")
          if [ -n "$OLD_IMAGE" ] && [ "$OLD_IMAGE" != "$NEW_IMAGE" ]; then
            docker image rm "$OLD_IMAGE" 2>/dev/null || true
          fi
